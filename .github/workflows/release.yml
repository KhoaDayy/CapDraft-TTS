name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v (e.g. 1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Sync deps + build
        shell: pwsh
        run: |
          uv sync --frozen --group dev
          uv run --frozen pyinstaller --noconfirm --clean CapDraft-TTS.spec

      - name: Package zip + sha256
        shell: pwsh
        run: |
          $Version = "${{ steps.ver.outputs.version }}"
          $ReleaseDir = "release"
          New-Item -ItemType Directory -Force $ReleaseDir | Out-Null
          $Archive = Join-Path $ReleaseDir "CapDraft-TTS-v$Version-windows-x64.zip"
          if (Test-Path $Archive) { Remove-Item -LiteralPath $Archive -Force }
          Compress-Archive -Path "dist\CapDraft-TTS\*" -DestinationPath $Archive -CompressionLevel Optimal
          $Hash = (Get-FileHash -Algorithm SHA256 $Archive).Hash.ToLowerInvariant()
          "$Hash  $(Split-Path -Leaf $Archive)" | Set-Content -Encoding ascii "$Archive.sha256"
          Write-Host "Built: $Archive"
          Write-Host "SHA256: $Hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: CapDraft TTS ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            release/CapDraft-TTS-v${{ steps.ver.outputs.version }}-windows-x64.zip
            release/CapDraft-TTS-v${{ steps.ver.outputs.version }}-windows-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Rust port (rust/), shipped as a beta next to the Python build (rust/DECISIONS.md ADR-010).
  build-windows-rust:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: pwsh
        run: cargo build --release --locked -p capdraft-app --manifest-path rust/Cargo.toml

      - name: Package zip + sha256
        shell: pwsh
        run: |
          $Version = "${{ steps.ver.outputs.version }}"
          $Stage = "release\CapDraft-TTS-rust"
          New-Item -ItemType Directory -Force "$Stage\external\capcut-tts-api" | Out-Null
          Copy-Item "rust\target\release\CapDraft-TTS.exe" $Stage
          Copy-Item "external\capcut-tts-api\device.json" "$Stage\external\capcut-tts-api"
          $Archive = "release\CapDraft-TTS-v$Version-rust-beta-windows-x64.zip"
          Compress-Archive -Path "$Stage\*" -DestinationPath $Archive -CompressionLevel Optimal
          $Hash = (Get-FileHash -Algorithm SHA256 $Archive).Hash.ToLowerInvariant()
          "$Hash  $(Split-Path -Leaf $Archive)" | Set-Content -Encoding ascii "$Archive.sha256"
          Write-Host "Built: $Archive"
          Write-Host "SHA256: $Hash"

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            release/CapDraft-TTS-v${{ steps.ver.outputs.version }}-rust-beta-windows-x64.zip
            release/CapDraft-TTS-v${{ steps.ver.outputs.version }}-rust-beta-windows-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
